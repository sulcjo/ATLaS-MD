schema_version: '1.0'
description: "Chignolin (GYDPETGTWG) adaptive-production 2D contacts x rama-map HMR-GaMD/REUS with 840 ns aggregate MD pool and <=16 active replicas."

genpept:
  # Basic run identity
  seq: "GYDPETGTWG"
  out: "chignolin_genpept_3"
  clean: true

  # Main workflow
  two_stage: true
  implicit_only: true

  # Initial Ramachandran generation / candidate selection
  # Moderate-large base map; later stages expand the frontier.
  n: 3000000
  n_candidate_seeds: 2500
  n_final_seeds: 1600
  jobs: 64


  generation_backend: fast
  rama_sampling: stratified
  initial_diversity_features: mixed
  diversity_bank_preset: broad

  # Cheap coarse quota filter before expensive clustering/minimization
  preselection_bin_quota: 3
  preselection_rg_bin_A: 1.0
  preselection_e2e_bin_A: 1.0
  preselection_contact_bin: 2
  preselection_include_bank: true

  # Implicit minimization
  adaptive_min: true
  implicit_max_iterations: 300
  adaptive_min_chunk_iterations: 25
  adaptive_min_energy_tol: 0.05
  adaptive_min_force_tol: 500.0
  adaptive_min_stall_rounds: 2

  # Basin hopping / MC local basin search
  # Enough parents to seed diverse local jumps, but not so many that NMA explodes downstream.
  basin_hop: true
  bh_parent_seeds: 120
  bh_steps: 3
  bh_md_steps: 350
  bh_temperature: 675.0
  bh_friction: 5.0
  bh_timestep: 0.0035
  bh_hmr_mass: 3.014
  bh_initial_min_iterations: 200
  bh_min_iterations: 150
  bh_restart_from_parent: true

  # ANM/NMA collective expansion
  # NMA expands from basin_hop_minima when BH is enabled.
  # Approximate probes: 120 parents * (1 parent + 3 hops) * 2 modes * 2 amplitudes * 2 signs = 3840.
  nma_expand: true
  nma_modes: 2
  nma_amplitudes: "0.75,1.35"
  nma_cutoff: 12.0

  # Adaptive PCA frontier exploration
  # Archive-aware cheap proposal/minimization stage to fill sparse PCA/contact-shape frontier regions
  # after the BH/NMA-expanded pool has been built.
  explore_loop: true
  explore_rounds: 2
  explore_proposals: 50000
  explore_keep: 250
  explore_bins: 45
  explore_target_max_count: 0
  explore_pca_padding: 0.15
  explore_frontier_only: true
  explore_allow_outside: true
  explore_max_kept_per_bin: 4
  explore_bh: false

# GAREUS-side import of GENPEPT structures as a prescan prior.
# GENPEPT itself still reads the top-level genpept: block above.
genpept_prescan:
  genpept_prescan_enabled: true
  genpept_prescan_dir: chignolin_genpept_3

  # Rescore these GENPEPT outputs with the active GaREUS CV definitions.
  genpept_prescan_stages:
    - candidate_seeds
    - aa_implicit_minimized_pdbs
    - basin_hop_minima
    - nma_probe_seeds
    - final_survivor_seeds

  genpept_prescan_rescore_active_cvs: true

  # Contact x Rama occupancy map resolution.
  genpept_prescan_contact_bin_width: 0.025
  genpept_prescan_rama_bin_width: 0.25
  genpept_prescan_min_hits_per_bin: 2

  # Use relaxed-ish stages for the stable contact frontier.
  genpept_prescan_frontier_stages:
    - aa_implicit_minimized_pdbs
    - basin_hop_minima
    - final_survivor_seeds

  # GENPEPT evidence biases windows/seeds but does not hard-exclude missing regions.
  genpept_prescan_use_as_window_prior: true
  genpept_prescan_use_as_seed_library: true
  genpept_prescan_absence_means_unknown: true

  genpept_prescan_output_prefix: genpept_prescan
  genpept_prescan_write_maps: true
  genpept_prescan_write_seed_assignments: true



genpept_prior:
  genpept_prior_enabled: true
  genpept_prior_dir: chignolin_genpept_seeds
  # Initial sparse prior must respect the active-replica cap.
  genpept_prior_max_windows: 16
cvs:
  cv1: contacts
  cv2: rama-map
  adaptive-min-total-windows: 8
  adaptive-max-total-windows: 16


contact_cv:
  contact_scheme: residue-balanced
  contact_atom_selection: backbone-heavy
  contact_min_sequence_separation: 3
  contact_r0_a: 4.8
  contact_beta_a_inv: 4.0
  contact_normalize: true

  contact_adaptive_min: 0.0
  contact_adaptive_max: 0.6
  contact_adaptive_target_spacing: 0.05
  # Total expanded 2D active-window/replica cap for contact x rama-map adaptive production.
  contact_adaptive_min_total_windows: 8
  contact_adaptive_max_total_windows: 16
  contact_adaptive_min_k_kcal: 50
  contact_adaptive_max_k_kcal: 100

  contact_autocalibrate_windows: true
  contact_autocalibration_steps: 10000
  contact_autocalibration_sample_interval: 20

  # Contact-frontier/probe logic for contact-primary adaptive feedback.
  contact_frontier_enabled: true
  contact_frontier_percentile: 99.0
  contact_frontier_margin: 0.02
  contact_frontier_min_span: 0.10
  contact_frontier_probe_count: 2
  contact_frontier_probe_spacing: 0.05
  contact_frontier_max_probe_offset: 0.15
  contact_disable_gapfill_above_unvalidated_frontier: true
  contact_frontier_confirm_rounds: 2
  contact_frontier_min_hit_fraction: 0.02
  contact_frontier_unreachable_deficit: 0.08
  contact_frontier_by_secondary_slice: true

secondary_cv:
  secondary_cv_adaptive_min_k_kcal: 20.0
  secondary_cv_adaptive_max_k_kcal: 100.0
  secondary_cv_k_mode: adaptive
  secondary_cv_adaptive_overlap_sigma: 20.0
  secondary_cv_adaptive_k_scale: 2.0

starting_structures:
  seed_conformers_dir: chignolin_genpept_seeds
  us_2d_start_secondary_ramp_stages: 5
  us_2d_start_secondary_k_pull_scale: 5.0
  us_pull_steps_per_window: 50000
  us_pull_timestep_fs: 3.0
  us_pull_k_kcal_a2: 75

windows:
  window_mode: adaptive-production
  adaptive_window_aggressiveness: aggressive
  adaptive_feedback_pilot_fraction: 0.008
  adaptive_feedback_validation_steps: 20000
  adaptive_feedback_rounds: 5
  adaptive_target_spacing_a: 0.05

  # Generic sparse 2D refinement. This is CV-agnostic and lets adaptive feedback
  # switch from full rectangular grids to explicit local 2D patch windows when
  # only specific primary-CV x secondary-CV neighborhoods need repair.
  sparse_2d_patches_enabled: true

  # Contact-tuned sparse 2D refinement. This keeps the generic machinery active,
  # but applies contact-specific frontier/probe behavior for nonlocal contacts.
  contact_sparse_2d_patches_enabled: true
  adaptive_2d_max_local_patches: 12
  adaptive_2d_min_edge_samples: 5

  # Explicit sparse 2D tables now use neutral primary-CV column names, while
  # legacy distance_* aliases are still accepted by the code.
  explicit_2d_window_schema: generic

  # Stateful adaptive-feedback classification.
  adaptive_feedback_region_state_enabled: true
  adaptive_feedback_region_memory_decay: 0.5
  adaptive_feedback_min_effective_samples: 50

  # Explicit action classes.
  adaptive_feedback_probe_unvalidated_regions: true
  adaptive_feedback_prune_overscanned_regions: true
  adaptive_feedback_extend_undersampled_regions: true


adaptive_production:
  # Global aggregate MD resource pool.  Aggregate ns = sum over all state segments
  # of (number_of_states_in_segment * steps_per_state * timestep_fs / 1e6).
  # At 4 fs and 16 active replicas, 840 aggregate ns is equivalent to ~13.125M
  # steps per replica if all 16 replicas were run uniformly.
  adaptive_production_total_md_pool_ns: 840.0
  adaptive_production_pool_hard_stop: true

  # Use multiple adaptive epochs; the convergence gate can still stop early.
  adaptive_production_epochs: 8
  adaptive_production_epoch_step_budget: 13125000   # 52.5 aggregate ns per adaptive epoch at 4 fs
  adaptive_production_epoch_steps: 250000           # fallback/base worker length when not scheduled

  # Active-replica count is capped by contact_adaptive_max_total_windows above.
  adaptive_production_min_state_steps: 100000       # 0.4 ns per state at 4 fs
  adaptive_production_max_state_steps: 750000       # 3.0 ns per state at 4 fs
  adaptive_production_new_state_steps: 750000       # give new bridge windows enough burn-in/sampling
  adaptive_production_allocation_scheduler: true

  # Reserve enough clean frozen-final production while still allowing several adaptive epochs.
  adaptive_production_final_pool_fraction: 0.50
  adaptive_production_min_final_pool_ns: 300.0
  adaptive_production_final_steps: 2000000          # clipped by pool/scheduler as needed
  adaptive_production_final_step_budget: 105000000  # 420 aggregate ns reserved target at 4 fs
  adaptive_production_final_allocation_scheduler: true
  adaptive_production_scheduled_final_segments: true

  # Stop adaptive refinement only when diagnostics look mature enough.
  adaptive_production_convergence_min_samples_per_state: 50
  adaptive_production_convergence_max_weak_edges: 0
  adaptive_production_convergence_allow_extend_actions: false
  adaptive_production_require_convergence_before_final: false

  # Resume/safety/analysis outputs.
  adaptive_production_resume: false
  adaptive_production_write_action_reports: true
  adaptive_production_write_union_mbar_inputs: true
  adaptive_production_run_union_mbar_analysis: true
  adaptive_production_union_fes_bins: "80,40"
  adaptive_production_final_connectivity_required: true
  adaptive_production_quality_hard_fail: false

  # Seed memory between epochs/final segments.
  adaptive_production_propagate_seed_bank: true
  adaptive_production_seed_bank_max_per_state: 1
  adaptive_production_state_aware_seed_filtering: true

explicit_2d_windows:
  explicit_2d_primary_cv_mode_column: primary_cv_mode
  explicit_2d_primary_center_column: primary_cv_center
  explicit_2d_primary_k_column: primary_cv_k_kcal
  explicit_2d_secondary_cv_mode_column: secondary_cv_mode
  explicit_2d_secondary_center_column: secondary_cv_center
  explicit_2d_secondary_k_column: secondary_cv_k_kcal_mol

output:
  seq: GYDPETGTWG
  out: chignolin_2d_run3/
  traj_interval: 50
  report_interval: 50
  distance_output_interval: 50
  progress_update_interval_sec: 30.0
  traj_format: xtc

platform:
  platform: CUDA
  setup_cpu_threads: 8

simulation:
  run_mode: hmr-gamd
  timestep_fs: 4.0
  nvt_warmup_timestep_fs: 0.5
  npt_ramp_timestep_fs: 1.0
  equil_safe_chunk_steps: 5000

gamd:
  gamd_production_steps: 1000000
  sigma0p_kcal_mol: 5.0
  sigma0d_kcal_mol: 5.0
  gamd_cmd_steps: 100000
  gamd_equil_steps: 100000
  gamd_averaging_window: 2000

exchange:
  exchange_mode: gibbs-walk
  exchange_interval: 100

tui:
  tui_mode: interactive

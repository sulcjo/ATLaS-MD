[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gareus-peptide"
version = "0.8"
description = "Modular GaREUS/GaMD peptide simulation workflow with backward-compatible gareus_peptide shim."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary / research internal"}
authors = [
  {name = "GAREUS project"}
]
keywords = ["molecular dynamics", "OpenMM", "GaMD", "REUS", "umbrella sampling", "peptides"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "numpy>=1.23",
]

[project.optional-dependencies]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.5", "pymdown-extensions>=10.0"]
config = ["PyYAML>=6"]
openmm = [
  "openmm>=8",
  "pdbfixer",
  "PeptideBuilder",
]
analysis = ["pymbar>=4", "pyarrow>=12", "duckdb>=0.9", "scipy>=1.10"]
dev = ["pytest>=7", "pyarrow>=12", "duckdb>=0.9"]
all = [
  "PyYAML>=6",
  "openmm>=8",
  "pdbfixer",
  "PeptideBuilder",
  "pymbar>=4",
  "scipy>=1.10",
  "pytest>=7",
  "pyarrow>=12",
  "duckdb>=0.9",
]

[project.scripts]
gareus-peptide = "gareus.core:main"
gareus = "gareus.core:main"
gareus-energy-decompose = "gareus.energy_decomposition:main"
gareus-test-run = "gareus.integration_test:main"
gareus-suggest-cvs = "gareus.cv_discovery:main"
gareus-consolidate-traj = "gareus.traj_consolidate:main"
gareus-analyze = "gareus.mbar_analysis.cli:main"

[tool.setuptools]
py-modules = ["gareus_peptide", "GENPEPT", "config_profiles", "analyze_gareus_mbar"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gareus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: real MD, minutes-long"]
# Deliberately no `addopts = "-q"` here.  addopts is *prepended* to the real
# command line, and -q is a counting flag: it compounded with the -q in this
# repo's own documented invocation (`python -m pytest -q tests/`) to give -qq,
# which suppresses pytest's final "N failed, M passed" count line completely.
# Runs then ended with bare FAILED lines and nothing after them, which reads
# like a suite that aborted rather than one that finished with failures.
# Pass -q on the command line when you want quiet output.

name: Release v0.8.2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'release: v0.8.2')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install release-gate dependencies
        run: python -m pip install -e ".[dev,docs]"

      - name: Verify packaged version
        run: |
          python - <<'PY'
          import gareus
          assert gareus.__version__ == "0.8.2", gareus.__version__
          PY
          python -m pytest -q tests/test_package_smoke.py::test_official_package_version_is_v082

      - name: Fast thermodynamic correctness gate
        run: python -m pytest -q tests/test_exchange_kernel_exact.py tests/test_gibbs_walk.py tests/test_exchange_fixes.py

      - name: Strict documentation build
        run: python -m mkdocs build --strict

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.8.2 >/dev/null 2>&1; then
            echo "v0.8.2 already exists; leaving it unchanged."
            exit 0
          fi
          gh release create v0.8.2 \
            --target "$GITHUB_SHA" \
            --title "ATLaS-MD v0.8.2" \
            --notes-file docs/releases/v0.8.2.md \
            --latest

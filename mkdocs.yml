site_name: ATLaS-MD
site_description: Adaptive Thermodynamic Landscape Sampling for molecular dynamics
site_url: https://sulcjo.github.io/2026_peptide_sampler/
repo_name: sulcjo/ATLaS-MD
repo_url: https://github.com/sulcjo/ATLaS-MD
edit_uri: edit/main/docs/atlas-md/
docs_dir: docs/atlas-md
theme:
  name: material
  language: en
  logo: assets/atlas-md-logo.svg
  favicon: assets/atlas-md-logo.svg
  features:
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.tabs
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
nav:
  - ATLaS-MD: index.md
  - Start:
      - Installation: start/installation.md
      - Quickstart: start/quickstart.md
      - Glossary: start/glossary.md
  - User guide:
      - System setup: guide/system-setup.md
      - Collective variables: guide/collective-variables.md
      - Umbrella windows and REUS: guide/windows-and-exchange.md
      - Thermodynamic validity: guide/thermodynamic-validity.md
      - GaMD: guide/gamd.md
      - Adaptive workflows: guide/adaptive-workflows.md
      - GENPEPT seeding: guide/genpept-seeding.md
      - Resume and restart: guide/resume.md
  - Analysis:
      - Analysis workflow: analysis/overview.md
      - PMF validity: analysis/pmf-validity.md
      - PMF health field guide: analysis/pmf-health-field-guide.md
      - Synthetic adaptive harness: analysis/synthetic-harness.md
      - Energy decomposition: analysis/energy-decomposition.md
  - Reference:
      - Command-line programs: reference/cli.md
      - Configuration: reference/configuration.md
      - Output artifacts: reference/output-artifacts.md
      - Python API: reference/python-api.md
  - Tutorials:
      - First CMD run: tutorials/first-cmd-run.md
      - Seeded 2D Chignolin: tutorials/chignolin-2d.md
      - GENPEPT Chignolin case study: tutorials/genpept-chignolin-case-study.md
      - Adaptive tICA handoff: tutorials/adaptive-tica.md
      - Reproducible fixtures: tutorials/reproducible-fixtures.md
  - Operations:
      - Progress and dashboard: operations/dashboard.md
      - Scratch and reproducibility: operations/reproducibility.md
      - Troubleshooting: operations/troubleshooting.md
  - Developer:
      - Architecture: developer/architecture.md
      - Testing and contributing: developer/contributing.md
      - Equilibrium CV selection — implementation plan: developer/equilibrium-cv-implementation-plan.md
      - Equilibrium CV selection — specification v0.1: developer/equilibrium-cv-selection-spec-v0.1.md
      - Equilibrium CV selection — adversarial review: developer/equilibrium-cv-selection-adversarial-review.md
      - Equilibrium CV selection — task log: developer/equilibrium-cv-task-log.md

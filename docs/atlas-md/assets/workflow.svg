<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">ATLaS-MD workflow</title>
  <desc id="desc">Sequence and conformers flow into adaptive thermodynamic states, replica exchange, structured storage, and MBAR/free-energy analysis.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity=".18"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker>
  </defs>
  <rect width="1200" height="420" rx="28" fill="#0d1117"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="54" y="58" fill="#e6edf3" font-size="28" font-weight="700">From conformers to thermodynamic inference</text>
    <text x="54" y="88" fill="#8b949e" font-size="16">Explicit state definitions · exchange-aware sampling · phase-local provenance</text>
    <g filter="url(#shadow)">
      <rect x="55" y="145" width="190" height="128" rx="18" fill="#161b22" stroke="#30363d"/>
      <rect x="285" y="125" width="300" height="168" rx="18" fill="#161b22" stroke="url(#accent)" stroke-width="2"/>
      <rect x="625" y="145" width="230" height="128" rx="18" fill="#161b22" stroke="#30363d"/>
      <rect x="895" y="145" width="250" height="128" rx="18" fill="#161b22" stroke="#30363d"/>
    </g>
    <g fill="#e6edf3" font-size="20" font-weight="650">
      <text x="82" y="184">Inputs</text><text x="318" y="164">Thermodynamic state ensemble</text><text x="657" y="184">Structured ledger</text><text x="930" y="184">Inference</text>
    </g>
    <g fill="#8b949e" font-size="15">
      <text x="82" y="216">sequence / PDB</text><text x="82" y="239">GENPEPT seeds</text>
      <text x="318" y="198">umbrella × CV₂ × GaMD λ</text><text x="318" y="266">adaptive placement → frozen production</text>
      <text x="657" y="216">Parquet samples</text><text x="657" y="239">exchange events + state maps</text>
      <text x="930" y="216">MBAR / PMF</text><text x="930" y="239">overlap + ESS + validation</text>
    </g>
    <g stroke="#8b949e" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M245 209 H278"/><path d="M585 209 H618"/><path d="M855 209 H888"/></g>
    <g transform="translate(330 215)" stroke="url(#accent)" stroke-width="2.5" fill="#0d1117">
      <path d="M10 0 H200" opacity=".55"/><circle cx="10" cy="0" r="8"/><circle cx="55" cy="0" r="8"/><circle cx="105" cy="0" r="8"/><circle cx="155" cy="0" r="8"/><circle cx="200" cy="0" r="8"/>
    </g>
    <text x="412" y="246" fill="#58a6ff" font-size="13">REUS / HREX / Gibbs-walk</text>
    <g fill="#8b949e" font-size="13"><text x="55" y="350">The sampler and estimator are treated as separate scientific contracts.</text><text x="55" y="374">Exchange kernels are validated independently of finite-timestep propagation and post-hoc reweighting.</text></g>
  </g>
</svg>

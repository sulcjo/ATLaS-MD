# Validation: native chignolin pipeline on Ace-Ala-Nme.
# Primary = cap-methyl end-to-end distance; secondary = rama-content scalar.
# hmr-gamd + REUS, manual 2D grid (5 distance x 4 rama = 20 windows).
description: "Ace-Ala-Nme hmr-gamd/REUS 2D (distance x rama-map) validation, 3x3 grid"
seq: "A"
input_pdb: "RUNS/ala_dipeptide_validation/ace_ala_nme.pdb"
out: "RUNS/ala_dipeptide_validation/validation"

water_model: tip3p
padding_nm: 1.0
temperature_k: 300.0
box_shape: dodecahedron

# platform left unset -> auto (picks CUDA on the cluster, OpenCL on the laptop).
run_mode: hmr-gamd
timestep_fs: 4.0

window_mode: manual
cv1: distance
cv_atom1: "1:CH3"   # ACE methyl carbon
cv_atom2: "-1:C"    # NME methyl carbon (amber14 renames NME CH3 -> C on load)
windows_a: [4.5, 6.0, 7.5]   # 3 cap-methyl distance centers (A)
window_k_kcal_a2: [40.0]     # single value => applied to all primary windows

cv2: rama-map
cv2_centers: [-1.0, 0.0, 1.0]   # beta / mid / alpha_l (GaMD boost + window 0 cover PPII & alpha_r)
cv2_k_default: 50.0
cv2_k_mode: fixed

exchange_mode: gibbs-walk
exchange_interval: 1000

# DENSE cumulant2 run: 1,000,000 samples/window for converged per-bin GaMD boost
# statistics. Sample/frame every 0.1 ps = 25 steps at 4 fs.
#   1,000,000 samples x 25 steps = 25,000,000 steps = 100 ns/window.
# At ~20 ns/day/window (9 windows, OpenCL) => ~5 days wall.
production_steps: 25000000
report_interval: 5000
# traj_interval MUST equal the sample cadence (distance_output_interval) so each
# saved frame maps 1:1 to a logged sample for phi/psi reweighting.
distance_output_interval: 25   # 0.1 ps
traj_interval: 25              # 0.1 ps
traj_format: xtc
traj_solute_only: true         # 22 solute atoms only -> ~130 MB/window (vs ~16 GB full)

schema_version: '1.0'
description: "Chignolin (GYDPETGTWG) 2D contacts x rama-map HMR-GaMD/REUS."

sequence:
  seq: GYDPETGTWG

genpept:
  seq: GYDPETGTWG
  out: chignolin_genpept_seeds
  clean: true
  n: 1500000
  n_candidate_seeds: 1000
  n_final_seeds: 200
  jobs: 64
  min_jobs: 1
  min_chunk_size: 1
  two_stage: true
  implicit_only: true
  no_explicit: true
  implicit_max_iterations: 100
  adaptive_min_chunk_iterations: 50
  adaptive_min_energy_tol: 0.5
  adaptive_min_force_tol: 1000.0
  adaptive_min_stall_rounds: 1
  basin_hop: true
  bh_parent_seeds: 20
  bh_steps: 3
  bh_md_steps: 100
  bh_timestep: 0.0035
  bh_hmr_mass: 3.014
  bh_initial_min_iterations: 50
  bh_min_iterations: 50
  platform: CPU
  device_index: '0'
  cpu_threads: 1
  min_jobs: 32
  diversity_bank_preset: chignolin
  preselection_bin_quota: 4
  tiered_implicit_min: true
  tier_refine_seeds: 200
  tier_refine_iterations: 100
  adaptive_min_force_check_every: 0
  assume_same_implicit_topology: true

# GAREUS-side import of GENPEPT structures as a prescan prior.
# GENPEPT itself still reads the top-level genpept: block above.
genpept_prescan:
  genpept_prescan_enabled: true
  genpept_prescan_dir: chignolin_genpept_seeds

  # Rescore these GENPEPT outputs with the active GaREUS CV definitions.
  genpept_prescan_stages:
    - candidate_seeds
    - aa_implicit_minimized_pdbs
    - basin_hop_minima
    - nma_probe_seeds
    - final_survivor_seeds

  genpept_prescan_rescore_active_cvs: true

  # Contact x Rama occupancy map resolution.
  genpept_prescan_contact_bin_width: 0.025
  genpept_prescan_rama_bin_width: 0.25
  genpept_prescan_min_hits_per_bin: 2

  # Use relaxed-ish stages for the stable contact frontier.
  genpept_prescan_frontier_stages:
    - aa_implicit_minimized_pdbs
    - basin_hop_minima
    - final_survivor_seeds

  # GENPEPT evidence biases windows/seeds but does not hard-exclude missing regions.
  genpept_prescan_use_as_window_prior: true
  genpept_prescan_use_as_seed_library: true
  genpept_prescan_absence_means_unknown: true

  genpept_prescan_output_prefix: genpept_prescan
  genpept_prescan_write_maps: true
  genpept_prescan_write_seed_assignments: true

cvs:
  cv1: contacts
  cv2: rama-map


contact_cv:
  contact_scheme: residue-balanced
  contact_atom_selection: backbone-heavy
  contact_min_sequence_separation: 3
  contact_r0_a: 4.8
  contact_beta_a_inv: 4.0
  contact_normalize: true

  contact_adaptive_min: 0.0
  contact_adaptive_max: 0.6
  contact_adaptive_target_spacing: 0.05
  contact_adaptive_min_k_kcal: 50
  contact_adaptive_max_k_kcal: 100

  contact_autocalibrate_windows: true
  contact_autocalibration_steps: 10000
  contact_autocalibration_sample_interval: 20

  # Contact-frontier/probe logic for contact-primary adaptive feedback.
  contact_frontier_enabled: true
  contact_frontier_percentile: 99.0
  contact_frontier_margin: 0.02
  contact_frontier_min_span: 0.10
  contact_frontier_probe_count: 2
  contact_frontier_probe_spacing: 0.05
  contact_frontier_max_probe_offset: 0.15
  contact_disable_gapfill_above_unvalidated_frontier: true
  contact_frontier_confirm_rounds: 2
  contact_frontier_min_hit_fraction: 0.02
  contact_frontier_unreachable_deficit: 0.08
  contact_frontier_by_secondary_slice: true

secondary_cv:
  secondary_cv_adaptive_min_k_kcal: 20.0
  secondary_cv_adaptive_max_k_kcal: 50.0
  secondary_cv_k_mode: adaptive
  secondary_cv_adaptive_overlap_sigma: 20.0
  secondary_cv_adaptive_k_scale: 2.0

starting_structures:
  seed_conformers_dir: chignolin_genpept_seeds
  us_2d_start_secondary_ramp_stages: 5
  us_2d_start_secondary_k_pull_scale: 5.0
  us_pull_steps_per_window: 50000
  us_pull_timestep_fs: 2.0
  us_pull_k_kcal_a2: 50

windows:
  window_mode: adaptive-feedback
  adaptive_window_aggressiveness: aggressive
  adaptive_feedback_pilot_fraction: 0.02
  adaptive_feedback_validation_steps: 20000
  adaptive_feedback_rounds: 5
  adaptive_target_spacing_a: 0.05

  # Generic sparse 2D refinement. This is CV-agnostic and lets adaptive feedback
  # switch from full rectangular grids to explicit local 2D patch windows when
  # only specific primary-CV x secondary-CV neighborhoods need repair.
  sparse_2d_patches_enabled: true

  # Contact-tuned sparse 2D refinement. This keeps the generic machinery active,
  # but applies contact-specific frontier/probe behavior for nonlocal contacts.
  contact_sparse_2d_patches_enabled: true
  adaptive_2d_max_local_patches: 12
  adaptive_2d_min_edge_samples: 5

  # Explicit sparse 2D tables now use neutral primary-CV column names, while
  # legacy distance_* aliases are still accepted by the code.
  explicit_2d_window_schema: generic

  # Stateful adaptive-feedback classification.
  adaptive_feedback_region_state_enabled: true
  adaptive_feedback_region_memory_decay: 0.5
  adaptive_feedback_min_effective_samples: 50

  # Explicit action classes.
  adaptive_feedback_probe_unvalidated_regions: true
  adaptive_feedback_prune_overscanned_regions: true
  adaptive_feedback_extend_undersampled_regions: true

explicit_2d_windows:
  explicit_2d_primary_cv_mode_column: primary_cv_mode
  explicit_2d_primary_center_column: primary_cv_center
  explicit_2d_primary_k_column: primary_cv_k_kcal
  explicit_2d_secondary_cv_mode_column: secondary_cv_mode
  explicit_2d_secondary_center_column: secondary_cv_center
  explicit_2d_secondary_k_column: secondary_cv_k_kcal_mol

output:
  out: chignolin_2d_newpackage/
  traj_interval: 50
  report_interval: 50
  distance_output_interval: 50
  progress_update_interval_sec: 30.0
  traj_format: xtc

platform:
  platform: CUDA
  setup_cpu_threads: 8

simulation:
  run_mode: hmr-gamd
  timestep_fs: 4.0
  nvt_warmup_timestep_fs: 0.5
  npt_ramp_timestep_fs: 1.0
  equil_safe_chunk_steps: 5000

gamd:
  gamd_production_steps: 3000000
  sigma0p_kcal_mol: 5.0
  sigma0d_kcal_mol: 5.0
  gamd_cmd_steps: 100000
  gamd_equil_steps: 100000
  gamd_averaging_window: 2000

exchange:
  exchange_mode: gibbs-walk
  exchange_interval: 200

tui:
  tui_mode: interactive

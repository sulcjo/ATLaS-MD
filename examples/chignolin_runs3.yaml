schema_version: '2.0'
description: "Chignolin (GYDPETGTWG) double-adaptive 2D contacts x torsion-pca HMR-GaMD/REUS with epoch-0 bootstrap handoff to tica-linear. Runs3: sigma0=3 kcal/mol, max_windows=24, min_windows=8, 4 µs budget, 3 epochs."

workflow_help: |
  ============================================================
  WORKFLOW: chignolin_runs3  (run as two commands)
  ============================================================

  COMMAND 1 — GENPEPT seed generation (separate, run first):
    python GENPEPT.py --config chignolin_runs3.yaml
  Output: chignolin_genpept_3/final_survivor_seeds.csv + PDBs
  NOTE: genpept_prescan reads chignolin_genpept_massive_prior (pre-existing),
        not the freshly generated chignolin_genpept_3.

  COMMAND 2 — GAREUS MD workflow:
    gareus --config chignolin_runs3.yaml
  Output: chignolin_2d_run3/

  ============================================================
  STAGE 0  GENPEPT (command 1)
  ============================================================
  - 3,000,000 raw structures, stratified Rama sampling, 64 workers
  - Implicit-solvent adaptive minimisation (<=300 iter)
  - Basin hopping: 120 parents x 3 hops x 350 MD steps at 675 K (HMR)
  - NMA expand: modes 1-2, amplitudes 0.75 A + 1.35 A
  - PCA frontier: 2 rounds x 50k proposals, 250 kept per 45 bins
  - Funnel -> 1600 final seeds

  ============================================================
  STAGE 1  SYSTEM SETUP  (command 2, automatic)
  ============================================================
  - Build GYDPETGTWG, explicit-solvent dodecahedron
  - NVT warmup 0.5 fs -> NPT ramp 1.0 fs
  - CV1 boundary pull: 2 x 100,000 steps at 1 fs, k=200 kcal/mol  [v7: 5x longer, 2x stronger]
    -> calibrates achievable contact-fraction range [lo, hi] per system
  - GENPEPT prescan on chignolin_genpept_massive_prior:
    scores candidate/minimised/BH/NMA/final-survivor PDBs by
    contact fraction -> window-centre prior + seed library

  ============================================================
  STAGE 2  INITIAL WINDOWS
  ============================================================
  CV1  nonlocal contacts: residue-balanced heavy atoms,
       r0=4.8 A, beta_inv=4.0 A^-1, normalised to [0,1]
       target spacing 0.05, k in [50, 250] kcal/mol (adaptive)
  CV2  bootstrap torsion PC1:
       seed-fit backbone torsion PCA coordinate for epoch 0,
       then one-shot handoff to tica-linear after first successful refit
       k in [5, 50] kcal/mol after handoff (adaptive spacing)
  Seeds: best-scoring GENPEPT survivors per window (active-CV)
  Starting-structure pull: 50,000 steps/window at 3 fs, k=75

  ============================================================
  STAGE 3  DOUBLE-ADAPTIVE PILOT PHASE  (5 feedback rounds)
  ============================================================
  window_mode=double-adaptive routes:
    run_adaptive_feedback_auto_loop  (pilots, skip final production)
    -> handoff CSV -> run_adaptive_production_auto_loop (stage 4)

  Each pilot round:
    pilot_steps=40,000 steps/replica (explicit; pilot_fraction fallback unused)
    = 160 ps/replica at 4 fs  (hmr-gamd)
    GaMD: sigma0p=sigma0d=3.0 kcal/mol, 1.25M equil steps (5 ns)
    WARNING: equil runs in pilots too => ~103M steps pilot overhead
    Exchange: Gibbs-walk every 100 steps

  After each pilot round >= 0 (iterative Delaunay, delaunay_after_round=0):
    samples.csv (CV1+CV2, all replicas pooled)
    -> KDE 64x64 grid, Scott BW
    -> greedy peak pick: up to 16 basin_anchor windows
       (density floor = 5th percentile)
    -> coverage scaffold (5x5 grid): inject scaffold windows   [v7: was 3x3=9]
       in any cell with no anchor within dedup_radius=0.10
       (up to 25 extra points; fills unvisited CV regions)
    -> scipy.spatial.Delaunay on all anchor points
    -> WARNING printed if any edge >= 2x median
       (signals coverage gap; check logs)
    -> bridge midpoints on edges > 0.20 normalised
    -> anisotropic k = 2*kBT/sigma^2 per window
       sigma = 0.5 x local neighbour spacing, per-axis
       k1 clamped [50, 250], k2 clamped [5, 100] kcal/mol
    -> stability check: max anchor shift vs previous round
       stability_tol=0.001 => all 5 rounds always run (no early-stop)
    -> write delaunay_initial_windows.csv -> next round

  Adaptive-feedback layer (every round):
    region memory (decay 0.5): tracks over/undersampled regions
    probes unvalidated, prunes overscanned, extends undersampled
    up to 16 sparse 2D local-patch candidates

  End of pilots: write double_adaptive_handoff_windows.csv
  Validation: 50,000 steps/replica (200 ps) with final layout

  ============================================================
  STAGE 4  ADAPTIVE-PRODUCTION  (budget: 2000 ns aggregate)
  ============================================================
  Starts from Delaunay-optimised handoff window layout.

  - Total pool: 2000 ns aggregate across all replicas
  - 5 epochs: each gets ~240 ns aggregate (60% of 2000 ns pool)
    Per-window per-epoch: ~240/N_windows ns (N_windows from pilots)
  - Final phase: 800 ns aggregate  (40% pool, min 300 ns)
    -> highest-quality samples for union-MBAR/PMF
  - Between epochs: add/retire windows based on coverage/convergence
    -> seed bank propagated per state (max 1 seed/state)
    -> GaMD calibration NOT repeated per epoch
  - Gibbs-walk exchange every 100 steps
  - XTC trajectories every 50 steps (200 fs frames)
  - Output: chignolin_2d_run3/adaptive_production/
  - Union-MBAR across all epochs + analysis_arrays.npz

  Resume: pool persisted in adaptive_production/adaptive_runtime_pool.json.
  To extend budget after run completes: patch total_ns in that JSON and
  re-run with --resume (NOT --md-budget-ns, which is ignored on resume).

  ============================================================
  KEY NUMBERS (N_windows ~ 10-25 from pilots)
  ============================================================
  Pilot overhead:  ~(160 ps prod + 5 ns equil) x N_windows x 5 rounds
  Adaptive-prod:   2000 ns total aggregate (budget-guaranteed)
    - Epochs (60%):  1200 ns aggregate, 8 x ~150 ns
    - Final  (40%):   800 ns aggregate
  Platform:         CUDA
  ============================================================

# NOTE: Schema v2.0 migration from chignolin_fulltreatment4.yaml.
# Lost params (dropped from CLI, now hardcoded internally):
#   contact_adaptive_max_total_windows: 16  → no equivalent; replica count now uncapped
#   adaptive_production_epoch_step_budget: 12600000  → auto-inferred from md_budget_ns + ap_epochs
#   adaptive_production_final_step_budget: 84000000  → auto-inferred from md_budget_ns + ap_final_pool_fraction
#   adaptive_production_convergence_allow_extend_actions: false  → hardcoded True
#   adaptive_production_min_state_steps: 100000  → hardcoded 0 (auto)
#   adaptive_production_max_state_steps: 12600000  → hardcoded 0 (auto)
#   adaptive_production_new_state_steps: 500000   → hardcoded 0 (auto)
#   genpept_prior_enabled: true  → genpept_prior dropped entirely from v2 CLI

genpept:
  seq: "GYDPETGTWG"
  out: "chignolin_genpept_r3"
  clean: false
  two_stage: true
  implicit_only: true
  n: 5000000
  n_candidate_seeds: 5000
  n_final_seeds: 2500
  jobs: 16
  min_jobs: 1
  generation_backend: fast
  rama_sampling: stratified
  initial_diversity_features: mixed
  diversity_bank_preset: broad
  preselection_bin_quota: 3
  preselection_rg_bin_A: 1.0
  preselection_e2e_bin_A: 1.0
  preselection_contact_bin: 2
  preselection_include_bank: true
  adaptive_min: true
  implicit_max_iterations: 300
  adaptive_min_chunk_iterations: 25
  adaptive_min_energy_tol: 0.05
  adaptive_min_force_tol: 500.0
  adaptive_min_stall_rounds: 2
  basin_hop: true
  bh_parent_seeds: 120
  bh_steps: 3
  bh_md_steps: 350
  bh_temperature: 675.0
  bh_friction: 5.0
  bh_timestep: 0.0035
  bh_hmr_mass: 3.014
  bh_initial_min_iterations: 200
  bh_min_iterations: 150
  bh_restart_from_parent: true
  nma_expand: true
  nma_modes: 2
  nma_amplitudes: "0.75,1.35"
  nma_cutoff: 12.0
  explore_loop: true
  explore_rounds: 5
  explore_proposals: 50000
  explore_keep: 250
  explore_bins: 45
  explore_target_max_count: 0
  explore_pca_padding: 0.15
  explore_frontier_only: true
  explore_allow_outside: true
  explore_max_kept_per_bin: 4
  explore_bh: false

genpept_prescan:
  genpept_prescan: true          # was: genpept_prescan_enabled
  genpept_prescan_dir: chignolin_genpept_7
  genpept_prescan_stages:
    - candidate_seeds
    - aa_implicit_minimized_pdbs
    - basin_hop_minima
    - nma_probe_seeds
    - final_survivor_seeds
  genpept_prescan_frontier_stages:
    - aa_implicit_minimized_pdbs
    - basin_hop_minima
    - final_survivor_seeds
  genpept_prescan_use_as_window_prior: true
  genpept_prescan_use_as_seed_library: true
  # Dropped: genpept_prescan_rescore_active_cvs, contact_bin_width, rama_bin_width,
  #          min_hits_per_bin, absence_means_unknown, output_prefix, write_maps,
  #          write_seed_assignments — all hardcoded to former defaults.

cvs:
  cv1: contacts
  cv2: torsion-pca
  # NOTE: adaptive-min/max-total-windows from old cvs block dropped in v2.
  # Total replica budget is settable again via windows.max_total_windows (below).

bootstrap_torsion_cv:
  bootstrap_torsion_source: seeds
  bootstrap_torsion_residualize_against_cv1: true
  bootstrap_torsion_component: 1
  bootstrap_torsion_min_seed_count: 20

contact_cv:
  # Contact physics (CV-specific)
  contact_scheme: residue-balanced
  contact_atom_selection: heavy
  contact_min_sequence_separation: 3   # was 2; sep=3 removes near-neighbor contacts, sharpens folded/unfolded discrimination for 10-residue peptide
  contact_r0_a: 4.8
  contact_beta_a_inv: 2.5
  contact_normalize: true

  # CV1 adaptive (unified; was contact_adaptive_*)
  cv1_range_min: 0.0             # was: contact_adaptive_min
  #cv1_range_max: 0.6             # was: contact_adaptive_max
  cv1_target_spacing: 0.10  # was: contact_adaptive_target_spacing + adaptive_target_spacing_a
  cv1_k_min: 50.0                # was: contact_adaptive_min_k_kcal
  cv1_k_max: 250.0               # was: contact_adaptive_max_k_kcal

  # CV boundary pull — active pull toward CV extremes to find achievable range.
  # v7: 5x longer (100 ps vs 20 ps) + 2x stronger force to overcome solvation
  # barrier from extended coil → compact. Range still determined per-system by
  # the achieved CV maximum; cv1_range_max is intentionally NOT set.
  cv1_boundary_pull_steps: 100000  # was: 20000
  cv1_boundary_pull_k: 200.0       # was: 100.0

  # Frontier probing: empirical ceiling; each accepted step must hold in both rounds.
  cv1_frontier: true
  cv1_frontier_probe_count: 2
  cv1_frontier_probe_spacing: 0.05
  cv1_frontier_confirm_rounds: 2
  cv1_frontier_min_hit_fraction: 0.02
  cv1_frontier_unreachable_deficit: 0.08

cv2:
  # CV2 adaptive (was secondary_cv_*)
  cv2_k_min: 20.0                # was: secondary_cv_adaptive_min_k_kcal
  cv2_k_max: 100.0               # was: secondary_cv_adaptive_max_k_kcal
  cv2_k_mode: adaptive           # was: secondary_cv_k_mode
  cv2_adaptive_overlap_sigma: 20.0   # was: secondary_cv_adaptive_overlap_sigma
  cv2_k_scale: 2.0               # was: secondary_cv_adaptive_k_scale

  # cv2 centers are derived automatically from bootstrap_torsion_cv for torsion-pca.

tica:
  tica_obs_interval: 50
  tica_lag_frames: 50
  tica_update_after_epochs: [0]
  tica_switch_cv2: true
  tica_linear_k_min: 5.0
  tica_linear_k_max: 50.0

starting_structures:
  seed_conformers_dir: chignolin_genpept_7  # reuse run7 seeds
  us_pull_steps_per_window: 50000
  us_pull_timestep_fs: 3.0
  us_pull_k: 75.0                # was: us_pull_k_kcal_a2
  us_pull_ramp_stages: 5         # was: us_2d_start_secondary_ramp_stages
  us_2d_secondary_k_scale: 5.0  # was: us_2d_start_secondary_k_pull_scale

windows:
  window_mode: double-adaptive
  aggressiveness: aggressive          # was: adaptive_window_aggressiveness
  pilot_fraction: 0.004               # used only when pilot_steps not set; kept as fallback
  pilot_steps: 40000                  # explicit pilot steps/round (160 ps at 4 fs); overrides pilot_fraction x production_steps
  validation_steps: 50000             # 200 ps validation with final layout
  adaptive_rounds: 5                  # was: adaptive_feedback_rounds
  sparse_2d: true                     # was: sparse_2d_patches_enabled + contact_sparse_2d_patches_enabled
  max_2d_patches: 32                  # was: adaptive_2d_max_local_patches
  max_total_windows: 24      # principled total replica/window cap (CV1xCV2); adaptive thins both axes to honour it. 0=uncapped.
  min_total_windows: 8       # minimum windows; adaptive cannot thin below this
  max_replicas: 24           # hard replica cap (truncates after generation)
  explicit_2d_window_schema: generic
  region_memory: true                 # was: adaptive_feedback_region_state_enabled
  region_memory_decay: 0.5            # was: adaptive_feedback_region_memory_decay
  region_probe_unvalidated: true      # was: adaptive_feedback_probe_unvalidated_regions
  region_prune_overscanned: true      # was: adaptive_feedback_prune_overscanned_regions
  region_extend_undersampled: true    # was: adaptive_feedback_extend_undersampled_regions
  # Dropped: adaptive_feedback_min_effective_samples, adaptive_2d_min_edge_samples — hardcoded.

  # Minimum pilot rounds: early-stop cannot trigger before this count regardless of convergence score.
  # Prevents run5-class failure where AF stopped after round 1 with a frozen ensemble.
  adaptive_min_rounds: 3               # new pipeline parameter (adaptive_feedback_min_rounds)

  target_overlap: 0.25                 # target neighboring-window histogram overlap (pilot/AF phase); default 0.25

  # CV coverage gates: block early-stop if pilot under-samples CV space.
  # Computed from samples.csv before cleanup; uses achievable range from boundary pull.
  pilot_min_cv1_coverage: 0.80        # CV1 (contacts): require 60% of [lo,hi] achievable range sampled
  pilot_min_cv2_coverage: 0.80        # CV2 (Ramachandran): require 70% of secondary-CV center span sampled

  # Iterative Delaunay within double-adaptive pilot phase.
  # Default for non-delaunay-feedback modes is OFF; set explicitly to enable.
  # delaunay_after_round=0: runs on every pilot round (0,1,2,3,4).
  # delaunay_stability_tol=0.001: near-zero => all 5 rounds always run (no early-stop).
  delaunay_iterate: true
  delaunay_stability_tol: 0.001

  # Coverage scaffold: inject grid windows in CV cells with no KDE-peak anchor.
  # v7: 5×5 grid → up to 25 scaffold points (was 3×3=9). Finer gap-fill ensures
  # the beta region (CV1 high, CV2 < -0.5) gets injected windows even if pilot
  # samples never visit it. System-agnostic improvement.
  delaunay_coverage_scaffold: true
  delaunay_coverage_grid_n: 5   # was: 3

adaptive_production:
  # Global aggregate MD pool — ACTIVE in double-adaptive (routes to adaptive-production)
  md_budget_ns: 4000.0               # 4 µs aggregate across all replicas

  # Epoch schedule
  ap_epochs: 3                        # 3 epochs then final phase
  # ap_epoch_steps / ap_final_steps: omit to let the code compute from pool balance.
  # Code recomputes epoch budget live at each epoch start: (remaining - final_reserve) / epochs_remaining.
  # With 4000 ns pool, ap_final_pool_fraction=0.70: epochs 30% = 1200 ns (3 x ~400 ns), final 70% = 2800 ns.

  # ap_target_overlap removed (unified → target_overlap; set once for both feedback and production loops)

  # Final phase
  ap_final_pool_fraction: 0.70        # was 0.40; precision bought in uniform locked-layout final phase (CV2/Ramachandran is slow-converging coordinate). 70% of 2000 ns = 1400 ns final.
  ap_min_final_pool_ns: 300.0         # was: adaptive_production_min_final_pool_ns
  # NOTE: adaptive_production_final_step_budget: 84000000 dropped — auto-inferred same way.

  # Resume / outputs
  ap_resume: true                     # was: adaptive_production_resume
  ap_write_reports: true              # was: adaptive_production_write_action_reports
  ap_write_mbar_inputs: true          # was: adaptive_production_write_union_mbar_inputs
  ap_run_mbar: true                   # was: adaptive_production_run_union_mbar_analysis
  ap_fes_bins: "40,80"               # was "80,40"; CV2 bins raised to 100 for higher Ramachandran PMF resolution

  # Seed bank
  ap_seed_bank: true                  # was: adaptive_production_propagate_seed_bank
  ap_seed_bank_max: 1                 # was: adaptive_production_seed_bank_max_per_state

  # NOTE: adaptive_production_convergence_allow_extend_actions: false dropped — v2 hardcodes True.
  #       This was used to require all extend actions to complete before early stop. Effect: v2
  #       may stop adaptive epochs slightly earlier than run4 did.
  # NOTE: adaptive_production_min/max/new_state_steps, epoch_step_budget, final_step_budget,
  #       allocation_scheduler, final_allocation_scheduler, scheduled_final_segments,
  #       state_aware_seed_filtering, pool_hard_stop, final_connectivity_required,
  #       quality_hard_fail, convergence_min_samples_per_state, convergence_max_weak_edges
  #       — all dropped; v2 hardcodes them to their former defaults.

explicit_2d_windows:
  explicit_2d_primary_cv_mode_column: primary_cv_mode
  explicit_2d_primary_center_column: primary_cv_center
  explicit_2d_primary_k_column: primary_cv_k_kcal
  explicit_2d_secondary_cv_mode_column: secondary_cv_mode
  explicit_2d_secondary_center_column: secondary_cv_center
  explicit_2d_secondary_k_column: secondary_cv_k_kcal_mol

output:
  seq: GYDPETGTWG
  out: chignolin_2d_run3
  traj_interval: 150
  report_interval: 150
  distance_output_interval: 150
  parquet_flush_rows: 200000             # was 5000; 200k rows/chunk ~= 13 ns/chunk at 15 windows/50-step interval → far fewer parquet parts
  traj_format: xtc
  traj_solute_only: true
  sample_potential_energy: false
  # Dropped: progress_update_interval_sec — hardcoded internally.

platform:
  platform: CUDA
  setup_cpu_threads: 8
  # CPU-platform thread budget (ignored when platform: CUDA).
  # cpu_budget distributes total cores across replicas automatically:
  #   threads_per_replica = floor(cpu_budget / n_replicas), min 1.
  # max_cpu_per_replica caps the result regardless of budget.
  # Examples for 32 cores, 8 windows:
  #   cpu_budget: 32              → 4 threads/replica
  #   cpu_budget: 32
  #   max_cpu_per_replica: 2     → 2 threads/replica
  #   cpu_threads: 4             → 4 threads/replica (no budget, explicit)
  cpu_budget: 32
  max_cpu_per_replica: 6

simulation:
  run_mode: hmr-gamd
  timestep_fs: 4.0
  nvt_warmup_timestep_fs: 0.5
  npt_ramp_timestep_fs: 1.0
  # Dropped: equil_safe_chunk_steps — hardcoded 100.

gamd:
  production_steps: 10000000          # double-adaptive: unused for epoch lengths (adaptive-production overrides per epoch from md_budget_ns pool); only fallback if pool disabled
  boost_type: lower-dual-nonbonded-dihedral  # fixes F1: lower-dual reads energy (all groups incl. umbrella group 0); this reads energy1+energy2 (group-specific), umbrella excluded
  sigma0p: 3.0                        # runs3: tighter boost (was 7.0); lower anharmonicity, less phase-space distortion
  sigma0d: 3.0                        # runs3: idem
  gamd_multiwindow_recon_cmd_steps: 50000   # short cMD seed (boost OFF) -> initial Vmax/Vmin/sigmaV
  gamd_multiwindow_recon_steps: 250000      # boosted recon steps per self-consistency iteration
  gamd_recon_boosted_iters: 4              # self-consistent boosted recon: measure sigmaV with boost ON
  gamd_recon_boosted_tol: 0.05             # stop when each group's sigmaV settles within 5%
  equil_steps: 1500000                # was 100000; 5 ns at 4 fs for thorough GaMD calibration; NOTE: runs in every pilot round too (heavy overhead, see workflow_help WARNING)
  gamd_averaging_window: 5000
  # Dropped: gamd_cmd_steps — hardcoded 50000.

exchange:
  exchange_mode: gibbs-walk
  exchange_interval: 500

tui:
  tui_mode: interactive

schema_version: '2.0'
description: "Chignolin (GYDPETGTWG) delaunay-feedback 2D contacts x rama-map HMR-GaMD/REUS: KDE basin-anchor picking + Delaunay triangulation on pilot CV samples replaces rectangular grid topology. Based on fulltreatment5; adaptive_production block present but unused (delaunay-feedback dispatches to adaptive-feedback pipeline). v6 tuning: production 10M steps/window (matches run2 near-converged budget), pilot 40k steps (was 8k), equil 5 ns (was 0.4 ns), sigma0=5 (was 6), seq_sep=3, stability_tol=0.001 (all 5 rounds always run)."

workflow_help: |
  ============================================================
  WORKFLOW: chignolin_fulltreatment6  (run as two commands)
  ============================================================

  COMMAND 1 — GENPEPT seed generation (separate, run first):
    python GENPEPT.py --config chignolin_fulltreatment6.yaml
  Output: chignolin_genpept_3/final_survivor_seeds.csv + PDBs
  NOTE: genpept_prescan reads chignolin_genpept_5 (pre-existing),
        not the freshly generated chignolin_genpept_3.

  COMMAND 2 — GAREUS MD workflow:
    gareus --config chignolin_fulltreatment6.yaml
  Output: chignolin_2d_run6/

  ============================================================
  STAGE 0  GENPEPT (command 1)
  ============================================================
  - 3,000,000 raw structures, stratified Rama sampling, 64 workers
  - Implicit-solvent adaptive minimisation (<=300 iter)
  - Basin hopping: 120 parents x 3 hops x 350 MD steps at 675 K (HMR)
  - NMA expand: modes 1-2, amplitudes 0.75 A + 1.35 A
  - PCA frontier: 2 rounds x 50k proposals, 250 kept per 45 bins
  - Funnel -> 1600 final seeds

  ============================================================
  STAGE 1  SYSTEM SETUP  (command 2, automatic)
  ============================================================
  - Build GYDPETGTWG, explicit-solvent dodecahedron
  - NVT warmup 0.5 fs -> NPT ramp 1.0 fs
  - CV1 boundary pull: 2 x 20,000 steps at 1 fs, k=100 kcal/mol
    -> calibrates achievable contact-fraction range [lo, hi]
  - GENPEPT prescan on chignolin_genpept_5:
    scores candidate/minimised/BH/NMA/final-survivor PDBs by
    contact fraction -> window-centre prior + seed library

  ============================================================
  STAGE 2  INITIAL WINDOWS
  ============================================================
  CV1  nonlocal contacts: residue-balanced heavy atoms,
       r0=4.8 A, beta_inv=4.0 A^-1, normalised to [0,1]
       target spacing 0.05, k in [50, 250] kcal/mol (adaptive)
  CV2  rama-map discrete centres:
       -1.0 (beta/extended), -0.333 (PPII/coil),
        0.333 (right-alpha),   1.0  (left-alpha)
       k in [5, 100] kcal/mol (Delaunay spacing, adaptive)
  Seeds: best-scoring GENPEPT survivors per window (active-CV)
  Starting-structure pull: 50,000 steps/window at 3 fs, k=75

  ============================================================
  STAGE 3  DELAUNAY-FEEDBACK PILOTS  (5 rounds)
  ============================================================
  Each pilot round:
    pilot_fraction=0.004 x 10,000,000 = 40,000 steps/replica
    = 160 ps/replica at 4 fs  (hmr-gamd)
    GaMD: sigma0p=sigma0d=5 kcal/mol, 1.25M equil steps (5 ns)
    WARNING: equil runs in pilots too => ~103M steps pilot overhead vs 160M production
    Exchange: Gibbs-walk every 100 steps

  After each pilot round >= 1 (iterative Delaunay):
    samples.csv (CV1+CV2, all replicas pooled)
    -> KDE 64x64 grid, Scott BW
    -> greedy peak pick: up to 16 basin_anchor windows
       (density floor = 5th percentile)
    -> coverage scaffold (3x3 grid): inject coverage_scaffold
       in any cell with no anchor within dedup_radius=0.10
       (up to 9 extra points; fills unvisited CV regions)
    -> scipy.spatial.Delaunay on all anchor points
    -> WARNING printed if any edge >= 2x median
       (signals coverage gap; check logs)
    -> bridge midpoints on edges > 0.20 normalised
    -> anisotropic k = 2*kBT/sigma^2 per window
       sigma = 0.5 x local neighbour spacing, per-axis
       k1 clamped [50, 250], k2 clamped [5, 100] kcal/mol
    -> stability check: if max anchor shift vs previous
       round < 0.05 (normalised) -> layout unchanged
    -> write delaunay_initial_windows.csv -> next round

  Adaptive-feedback layer (every round):
    region memory (decay 0.5): tracks over/undersampled regions
    probes unvalidated, prunes overscanned, extends undersampled
    up to 16 sparse 2D local-patch candidates

  Validation: 20,000 steps/replica (80 ps) with final layout

  ============================================================
  STAGE 4  FINAL PRODUCTION
  ============================================================
  - Fixed window set from last stable Delaunay layout
  - 10,000,000 steps/replica at 4 fs = 40 ns/replica (hmr-gamd)
  - GaMD: sigma0p=sigma0d=5 kcal/mol, 1.25M equil per replica (5 ns)
  - Gibbs-walk exchange every 100 steps
  - XTC trajectories every 50 steps (200 fs frames)
  - Output: chignolin_2d_run6/final_production/
  - analysis_arrays.npz + samples.csv (pooled) for MBAR/PMF

  ============================================================
  KEY NUMBERS
  ============================================================
  Pilot overhead:  ~(160 ps production + 5 ns equil) x N_windows x 5 rounds
  Final MD:        40 ns x N_windows  (N_windows ~ 10-25)
  Platform:         CUDA
  NOTE: adaptive_production block (md_budget_ns: 840)
        is PRESENT but UNUSED -- delaunay-feedback routes
        through adaptive-feedback pipeline only.
  ============================================================

# NOTE: Schema v2.0 migration from chignolin_fulltreatment4.yaml.
# Lost params (dropped from CLI, now hardcoded internally):
#   contact_adaptive_max_total_windows: 16  → no equivalent; replica count now uncapped
#   adaptive_production_epoch_step_budget: 12600000  → auto-inferred from md_budget_ns + ap_epochs
#   adaptive_production_final_step_budget: 84000000  → auto-inferred from md_budget_ns + ap_final_pool_fraction
#   adaptive_production_convergence_allow_extend_actions: false  → hardcoded True
#   adaptive_production_min_state_steps: 100000  → hardcoded 0 (auto)
#   adaptive_production_max_state_steps: 12600000  → hardcoded 0 (auto)
#   adaptive_production_new_state_steps: 500000   → hardcoded 0 (auto)
#   genpept_prior_enabled: true  → genpept_prior dropped entirely from v2 CLI

genpept:
  seq: "GYDPETGTWG"
  out: "chignolin_genpept_3"
  clean: false
  two_stage: true
  implicit_only: true
  n: 3000000
  n_candidate_seeds: 2500
  n_final_seeds: 1600
  jobs: 64
  generation_backend: fast
  rama_sampling: stratified
  initial_diversity_features: mixed
  diversity_bank_preset: broad
  preselection_bin_quota: 3
  preselection_rg_bin_A: 1.0
  preselection_e2e_bin_A: 1.0
  preselection_contact_bin: 2
  preselection_include_bank: true
  adaptive_min: true
  implicit_max_iterations: 300
  adaptive_min_chunk_iterations: 25
  adaptive_min_energy_tol: 0.05
  adaptive_min_force_tol: 500.0
  adaptive_min_stall_rounds: 2
  basin_hop: true
  bh_parent_seeds: 120
  bh_steps: 3
  bh_md_steps: 350
  bh_temperature: 675.0
  bh_friction: 5.0
  bh_timestep: 0.0035
  bh_hmr_mass: 3.014
  bh_initial_min_iterations: 200
  bh_min_iterations: 150
  bh_restart_from_parent: true
  nma_expand: true
  nma_modes: 2
  nma_amplitudes: "0.75,1.35"
  nma_cutoff: 12.0
  explore_loop: true
  explore_rounds: 2
  explore_proposals: 50000
  explore_keep: 250
  explore_bins: 45
  explore_target_max_count: 0
  explore_pca_padding: 0.15
  explore_frontier_only: true
  explore_allow_outside: true
  explore_max_kept_per_bin: 4
  explore_bh: false

genpept_prescan:
  genpept_prescan: true          # was: genpept_prescan_enabled
  genpept_prescan_dir: chignolin_genpept_5
  genpept_prescan_stages:
    - candidate_seeds
    - aa_implicit_minimized_pdbs
    - basin_hop_minima
    - nma_probe_seeds
    - final_survivor_seeds
  genpept_prescan_frontier_stages:
    - aa_implicit_minimized_pdbs
    - basin_hop_minima
    - final_survivor_seeds
  genpept_prescan_use_as_window_prior: true
  genpept_prescan_use_as_seed_library: true
  # Dropped: genpept_prescan_rescore_active_cvs, contact_bin_width, rama_bin_width,
  #          min_hits_per_bin, absence_means_unknown, output_prefix, write_maps,
  #          write_seed_assignments — all hardcoded to former defaults.

cvs:
  cv1: contacts
  cv2: rama-map
  # NOTE: adaptive-min/max-total-windows from old cvs block dropped in v2.
  # contact_adaptive_max_total_windows: 16 is no longer settable; replica count uncapped.

contact_cv:
  # Contact physics (CV-specific)
  contact_scheme: residue-balanced
  contact_atom_selection: heavy
  contact_min_sequence_separation: 3   # was 2; sep=3 removes near-neighbor contacts, sharpens folded/unfolded discrimination for 10-residue peptide
  contact_r0_a: 4.8
  contact_beta_a_inv: 4.0
  contact_normalize: true

  # CV1 adaptive (unified; was contact_adaptive_*)
  cv1_range_min: 0.0             # was: contact_adaptive_min
  #cv1_range_max: 0.6             # was: contact_adaptive_max
  cv1_target_spacing: 0.05       # was: contact_adaptive_target_spacing + adaptive_target_spacing_a
  cv1_k_min: 50.0                # was: contact_adaptive_min_k_kcal
  cv1_k_max: 250.0               # was: contact_adaptive_max_k_kcal

  # CV boundary pull — active pull toward CV extremes to find achievable range
  cv1_boundary_pull_steps: 20000
  cv1_boundary_pull_k: 100.0

  # Frontier probing (was contact_frontier_enabled + contact_frontier_probe_count)
  cv1_frontier: true
  cv1_frontier_probe_count: 2
  # Dropped: contact_frontier_percentile, margin, min_span, probe_spacing,
  #          max_probe_offset, disable_gapfill_above_unvalidated_frontier,
  #          confirm_rounds, min_hit_fraction, unreachable_deficit,
  #          by_secondary_slice — all hardcoded to former defaults.

cv2:
  # CV2 adaptive (was secondary_cv_*)
  cv2_k_min: 5.0                # was: secondary_cv_adaptive_min_k_kcal
  cv2_k_max: 100.0               # was: secondary_cv_adaptive_max_k_kcal
  cv2_k_mode: adaptive           # was: secondary_cv_k_mode
  cv2_adaptive_overlap_sigma: 20.0   # was: secondary_cv_adaptive_overlap_sigma
  cv2_k_scale: 2.0               # was: secondary_cv_adaptive_k_scale

starting_structures:
  seed_conformers_dir: chignolin_genpept_5
  us_pull_steps_per_window: 50000
  us_pull_timestep_fs: 3.0
  us_pull_k: 75.0                # was: us_pull_k_kcal_a2
  us_pull_ramp_stages: 5         # was: us_2d_start_secondary_ramp_stages
  us_2d_secondary_k_scale: 5.0  # was: us_2d_start_secondary_k_pull_scale

windows:
  window_mode: delaunay-feedback
  aggressiveness: aggressive          # was: adaptive_window_aggressiveness
  pilot_fraction: 0.004               # was 0.008; 0.004 x 10M production = 40,000 pilot steps/round (160 ps)
  validation_steps: 50000             # was 20000; 200 ps validation with final layout
  adaptive_rounds: 5                  # was: adaptive_feedback_rounds
  sparse_2d: true                     # was: sparse_2d_patches_enabled + contact_sparse_2d_patches_enabled
  max_2d_patches: 16                  # was: adaptive_2d_max_local_patches
  explicit_2d_window_schema: generic
  region_memory: true                 # was: adaptive_feedback_region_state_enabled
  region_memory_decay: 0.5            # was: adaptive_feedback_region_memory_decay
  region_probe_unvalidated: true      # was: adaptive_feedback_probe_unvalidated_regions
  region_prune_overscanned: true      # was: adaptive_feedback_prune_overscanned_regions
  region_extend_undersampled: true    # was: adaptive_feedback_extend_undersampled_regions
  # Dropped: adaptive_feedback_min_effective_samples, adaptive_2d_min_edge_samples — hardcoded.

  # Minimum pilot rounds: early-stop cannot trigger before this count regardless of convergence score.
  # Prevents run5-class failure where AF stopped after round 1 with a frozen ensemble.
  adaptive_min_rounds: 2               # new pipeline parameter (adaptive_feedback_min_rounds)

  # CV coverage gates: block early-stop if pilot under-samples CV space.
  # Computed from samples.csv before cleanup; uses achievable range from boundary pull.
  pilot_min_cv1_coverage: 0.60        # CV1 (contacts): require 60% of [lo,hi] achievable range sampled
  pilot_min_cv2_coverage: 0.70        # CV2 (Ramachandran): require 70% of secondary-CV center span sampled

  # Iterative Delaunay: re-run placement every pilot round >= 1 until anchor set stabilises.
  # Prevents blind spots from poor first-round pilot coverage.
  delaunay_iterate: true
  delaunay_stability_tol: 0.001        # was 0.05; near-zero => Delaunay never declares layout stable early; all 5 rounds always run (disables early-stop via stability criterion)

  # Coverage scaffold: inject grid windows in CV cells with no KDE-peak anchor.
  # 3×3 grid → up to 9 scaffold points covering the full contacts×rama-map space.
  delaunay_coverage_scaffold: true
  delaunay_coverage_grid_n: 3

adaptive_production:
  # Global aggregate MD pool
  md_budget_ns: 840.0                 # was: adaptive_production_total_md_pool_ns

  # Epoch schedule
  ap_epochs: 5                        # was 10; 5 epochs with larger per-epoch budget from 10M production steps
  # ap_epoch_steps / ap_final_steps: omit to let the code compute from pool balance.
  # Code now distributes remaining budget evenly across remaining epochs using actual
  # n_states and timestep. Explicit values override if set > 0.

  # Final phase
  ap_final_pool_fraction: 0.40        # was: adaptive_production_final_pool_fraction
  ap_min_final_pool_ns: 300.0         # was: adaptive_production_min_final_pool_ns
  # NOTE: adaptive_production_final_step_budget: 84000000 dropped — auto-inferred same way.

  # Resume / outputs
  ap_resume: true                     # was: adaptive_production_resume
  ap_write_reports: true              # was: adaptive_production_write_action_reports
  ap_write_mbar_inputs: true          # was: adaptive_production_write_union_mbar_inputs
  ap_run_mbar: true                   # was: adaptive_production_run_union_mbar_analysis
  ap_fes_bins: "80,100"               # was "80,40"; CV2 bins raised to 100 for higher Ramachandran PMF resolution

  # Seed bank
  ap_seed_bank: true                  # was: adaptive_production_propagate_seed_bank
  ap_seed_bank_max: 1                 # was: adaptive_production_seed_bank_max_per_state

  # NOTE: adaptive_production_convergence_allow_extend_actions: false dropped — v2 hardcodes True.
  #       This was used to require all extend actions to complete before early stop. Effect: v2
  #       may stop adaptive epochs slightly earlier than run4 did.
  # NOTE: adaptive_production_min/max/new_state_steps, epoch_step_budget, final_step_budget,
  #       allocation_scheduler, final_allocation_scheduler, scheduled_final_segments,
  #       state_aware_seed_filtering, pool_hard_stop, final_connectivity_required,
  #       quality_hard_fail, convergence_min_samples_per_state, convergence_max_weak_edges
  #       — all dropped; v2 hardcodes them to their former defaults.

explicit_2d_windows:
  explicit_2d_primary_cv_mode_column: primary_cv_mode
  explicit_2d_primary_center_column: primary_cv_center
  explicit_2d_primary_k_column: primary_cv_k_kcal
  explicit_2d_secondary_cv_mode_column: secondary_cv_mode
  explicit_2d_secondary_center_column: secondary_cv_center
  explicit_2d_secondary_k_column: secondary_cv_k_kcal_mol

output:
  seq: GYDPETGTWG
  out: chignolin_2d_run6
  traj_interval: 50
  report_interval: 50
  distance_output_interval: 50
  traj_format: xtc
  # Dropped: progress_update_interval_sec — hardcoded internally.

platform:
  platform: CUDA
  setup_cpu_threads: 8
  # CPU-platform thread budget (ignored when platform: CUDA).
  # cpu_budget distributes total cores across replicas automatically:
  #   threads_per_replica = floor(cpu_budget / n_replicas), min 1.
  # max_cpu_per_replica caps the result regardless of budget.
  # Examples for 32 cores, 8 windows:
  #   cpu_budget: 32              → 4 threads/replica
  #   cpu_budget: 32
  #   max_cpu_per_replica: 2     → 2 threads/replica
  #   cpu_threads: 4             → 4 threads/replica (no budget, explicit)
  cpu_budget: 64
  max_cpu_per_replica: 6

simulation:
  run_mode: hmr-gamd
  timestep_fs: 4.0
  nvt_warmup_timestep_fs: 0.5
  npt_ramp_timestep_fs: 1.0
  # Dropped: equil_safe_chunk_steps — hardcoded 100.

gamd:
  production_steps: 10000000          # was 1000000; 10M steps = 40 ns/window at 4 fs; matches run2 near-converged budget (10M achieved RMSE=0.113, just above 0.1 threshold)
  sigma0p: 5.0                        # was 6.0; reduced 15% to lower anharmonicity score from ~0.58 toward ~0.45
  sigma0d: 5.0                        # was 6.0; idem
  equil_steps: 1250000                # was 100000; 5 ns at 4 fs for thorough GaMD calibration; NOTE: runs in every pilot round too (heavy overhead, see workflow_help WARNING)
  gamd_averaging_window: 2000
  # Dropped: gamd_cmd_steps — hardcoded 50000.

exchange:
  exchange_mode: gibbs-walk
  exchange_interval: 100

tui:
  tui_mode: interactive

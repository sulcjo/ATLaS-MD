# RUN 06: adaptive PCA frontier control
# Purpose: Cheap non-BH/non-NMA exploration mode.
# Tests whether archive-aware PCA frontier proposals add useful basins after initial implicit minimization.
# This isolates PCA-frontier value: basin_hop=false and nma_expand=false.

genpept:
  # Basic run identity
  seq: "GYDPETGTWG"
  out: "chignolin_genpept_run06_pca_frontier_control"
  clean: true

  # Main workflow
  two_stage: true
  implicit_only: true

  # Initial Ramachandran generation / candidate selection
  # Kept moderate because the adaptive PCA loop adds additional minimized structures.
  n: 150000
  n_candidate_seeds: 1200
  n_final_seeds: 1200

  generation_backend: fast
  rama_sampling: stratified
  initial_diversity_features: mixed
  diversity_bank_preset: broad

  # Cheap coarse quota filter before expensive clustering/minimization
  preselection_bin_quota: 3
  preselection_rg_bin_A: 1.0
  preselection_e2e_bin_A: 1.0
  preselection_contact_bin: 2
  preselection_include_bank: true

  # Implicit minimization
  adaptive_min: true
  implicit_max_iterations: 300
  adaptive_min_chunk_iterations: 25
  adaptive_min_energy_tol: 0.05
  adaptive_min_force_tol: 500.0
  adaptive_min_stall_rounds: 2

  # Keep BH/NMA disabled to isolate adaptive PCA frontier exploration.
  basin_hop: false
  nma_expand: false

  # Adaptive PCA frontier exploration
  # current relaxed archive -> PCA/contact-shape grid -> sparse/frontier target bins
  # -> cheap Ramachandran proposals -> keep frontier hits -> implicit minimize kept hits
  explore_loop: true
  explore_rounds: 2
  explore_proposals: 75000
  explore_keep: 350
  explore_bins: 45
  explore_target_max_count: 0
  explore_pca_padding: 0.15
  explore_frontier_only: true
  explore_allow_outside: true
  explore_max_kept_per_bin: 4
  explore_bh: false

  # OpenMM / runtime
  ff: amber14
  water: tip3pfb
  ph: 7.0
  temperature: 300.0
  platform: OpenCL        # change to CUDA, auto, or CPU if needed
  precision: mixed
  min_jobs: 1             # keep 1 for one GPU
  jobs: 8
  cpu_threads: 4

  # Output / UI niceties
  live_hist: true
  turbo_summary: true

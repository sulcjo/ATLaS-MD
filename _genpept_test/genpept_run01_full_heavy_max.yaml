# RUN 01: full heavy maximum reference
# Purpose: Largest reference run. Tests the full BH + NMA frontier-expansion pipeline.

genpept:
  # Basic run identity
  seq: "GYDPETGTWG"
  out: "chignolin_genpept_run01_full_heavy_max"
  clean: true

  # Main workflow
  two_stage: true
  implicit_only: true

  # Initial Ramachandran generation / candidate selection
  n: 500000
  n_candidate_seeds: 5000
  n_final_seeds: 2000

  generation_backend: fast
  rama_sampling: stratified
  initial_diversity_features: mixed
  diversity_bank_preset: broad

  # Cheap coarse quota filter before expensive clustering/minimization
  preselection_bin_quota: 3
  preselection_rg_bin_A: 1.0
  preselection_e2e_bin_A: 1.0
  preselection_contact_bin: 2
  preselection_include_bank: true

  # Implicit minimization
  adaptive_min: true
  implicit_max_iterations: 300
  adaptive_min_chunk_iterations: 25
  adaptive_min_energy_tol: 0.05
  adaptive_min_force_tol: 500.0
  adaptive_min_stall_rounds: 2

  # Basin hopping / MC local basin search
  basin_hop: true
  bh_parent_seeds: 250
  bh_steps: 4
  bh_md_steps: 400
  bh_temperature: 700.0
  bh_friction: 5.0
  bh_timestep: 0.0035
  bh_hmr_mass: 3.014
  bh_initial_min_iterations: 200
  bh_min_iterations: 150
  bh_restart_from_parent: true

  # ANM/NMA collective expansion
  nma_expand: true
  nma_modes: 3
  nma_amplitudes: "0.75,1.25,1.75,2.15"
  nma_cutoff: 12.0

  # Adaptive PCA frontier exploration
  # Enable PCA-based frontier exploration to further expand conformational diversity.
  explore_loop: true
  # Number of PCA exploration rounds; one round keeps the heavy run manageable.
  explore_rounds: 1
  # Number of raw Ramachandran proposals generated per round for PCA frontier targets.
  explore_proposals: 75000
  # Number of proposals to keep and minimize per round after frontier bin selection.
  explore_keep: 350
  # Number of bins for the PCA/contact-shape map used to define the frontier.
  explore_bins: 45
  # Maximum allowed count per coarse bin in the adaptive frontier map; 0 uses the default (no cap).
  explore_target_max_count: 0
  # Accept new proposals only from frontier/sparse regions of the PCA/contact-shape map.
  explore_frontier_only: true
  # Allow proposals outside the current explored map; useful for exploring novel regions.
  explore_allow_outside: true
  # Limit the number of accepted proposals per bin before minimization; helps avoid overload.
  explore_max_kept_per_bin: 4
  # Disable basin-hop restart from PCA-frontier hits to limit runtime in this heavy run.
  explore_bh: false

  # OpenMM / runtime
  ff: amber14
  water: tip3pfb
  ph: 7.0
  temperature: 300.0
  platform: OpenCL        # change to CUDA, auto, or CPU if needed
  precision: mixed
  min_jobs: 1             # keep 1 for one GPU
  jobs: 8
  cpu_threads: 4

  # Output / UI niceties
  live_hist: true
  turbo_summary: true

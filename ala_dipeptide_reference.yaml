# Unbiased reference: ground-truth phi/psi for Ace-Ala-Nme in TIP3P.
# Single manual window, NO umbrella restraint (k=0), no secondary CV, no GaMD.
description: "Ace-Ala-Nme unbiased reference (hmr-cmd, single unrestrained window)"
seq: "A"
input_pdb: "RUNS/ala_dipeptide_validation/ace_ala_nme.pdb"
out: "RUNS/ala_dipeptide_validation/reference"

water_model: tip3p
padding_nm: 1.0
temperature_k: 300.0
box_shape: dodecahedron

run_mode: hmr-cmd
timestep_fs: 4.0

window_mode: manual
windows_a: [5.5]
window_k_kcal_a2: [0.0]
cv1: distance
cv_atom1: "1:CH3"   # ACE methyl carbon
cv_atom2: "-1:C"    # NME methyl carbon (amber14 renames NME CH3 -> C on load)
cv2: none

# Full reference: 100 ns unbiased (25,000,000 steps at 4 fs).
# Reference phi/psi FES is histogrammed directly from the trajectory by
# validate_ala_dipeptide.py (independent of the MBAR pipeline), so frame/sample
# alignment is irrelevant here; traj_interval just sets reference histogram density.
production_steps: 25000000
report_interval: 5000
traj_interval: 5000          # 5000 frames over 100 ns
traj_format: xtc
exchange_mode: neighbor      # single window => no exchange anyway
